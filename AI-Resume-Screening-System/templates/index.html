<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Resume Screening System</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #0f172a,
                #1e293b
            );

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 40px;

            color: white;
        }

        .container {

            width: 100%;
            max-width: 1000px;

            background: rgba(255,255,255,0.08);

            backdrop-filter: blur(15px);

            border: 1px solid rgba(255,255,255,0.1);

            border-radius: 25px;

            padding: 40px;

            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }

        .title {

            text-align: center;

            margin-bottom: 40px;
        }

        .title h1 {

            font-size: 42px;

            margin-bottom: 10px;
        }

        .title p {

            color: #cbd5e1;

            font-size: 18px;
        }

        .upload-section {

            background: rgba(255,255,255,0.05);

            padding: 30px;

            border-radius: 20px;

            margin-bottom: 30px;
        }

        input[type="file"] {

            width: 100%;

            padding: 15px;

            border-radius: 12px;

            border: none;

            background: #f1f5f9;

            margin-bottom: 20px;
        }

        textarea {

            width: 100%;

            height: 140px;

            padding: 15px;

            border-radius: 12px;

            border: none;

            resize: none;

            font-size: 15px;

            margin-bottom: 20px;
        }

        button {

            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 12px;

            background: linear-gradient(
                135deg,
                #3b82f6,
                #2563eb
            );

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {

            transform: translateY(-2px);

            opacity: 0.9;
        }

        .results-grid {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 20px;

            margin-top: 30px;
        }

        .card {

            background: rgba(255,255,255,0.05);

            padding: 25px;

            border-radius: 20px;

            min-height: 220px;
        }

        .card h2 {

            margin-bottom: 20px;

            font-size: 24px;
        }

        .skill-tag {

            display: inline-block;

            padding: 10px 16px;

            background: #2563eb;

            border-radius: 30px;

            margin: 8px;

            font-size: 14px;
        }

        .missing-tag {

            display: inline-block;

            padding: 10px 16px;

            background: #dc2626;

            border-radius: 30px;

            margin: 8px;

            font-size: 14px;
        }

        .score-section {

            grid-column: span 2;
        }

        .progress-bar {

            width: 100%;

            height: 35px;

            background: rgba(255,255,255,0.1);

            border-radius: 20px;

            overflow: hidden;

            margin-top: 20px;
        }

        .progress {

            height: 100%;

            background: linear-gradient(
                135deg,
                #22c55e,
                #16a34a
            );

            display: flex;

            align-items: center;

            justify-content: center;

            font-weight: bold;
        }

        @media(max-width: 768px) {

            .results-grid {

                grid-template-columns: 1fr;
            }

            .score-section {

                grid-column: span 1;
            }

            .title h1 {

                font-size: 32px;
            }
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="title">

            <h1>AI Resume Screening System 🚀</h1>

            <p>
                Analyze resumes intelligently using AI-powered skill matching
            </p>

        </div>

        <div class="upload-section">

            <form method="POST" enctype="multipart/form-data">

                <input type="file" name="resume">

                <textarea
                    name="job_description"
                    placeholder="Paste Job Description Here..."
                ></textarea>

                <button type="submit">
                    Analyze Resume
                </button>

            </form>

        </div>

        <div class="results-grid">

            <div class="card">

                <h2>Detected Skills</h2>

                {% for skill in skills %}

                    <span class="skill-tag">
                        {{ skill }}
                    </span>

                {% endfor %}

            </div>

            <div class="card">

                <h2>Missing Skills</h2>

                {% for skill in missing %}

                    <span class="missing-tag">
                        {{ skill }}
                    </span>

                {% endfor %}

            </div>

            <div class="card score-section">

                <h2>Match Score</h2>

                <div class="progress-bar">

                    <div
                        class="progress"
                        style="width: {{ score }}%;"
                    >

                        {{ score }}%

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
